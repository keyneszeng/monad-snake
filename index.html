<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monad Snake 🐍</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff9f;
            flex-direction: column;
        }
        h1 {
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff9f;
        }
        canvas {
            border: 4px solid #00ff9f;
            background: #111;
            image-rendering: pixelated;
        }
        .info {
            margin-top: 15px;
            display: flex;
            gap: 30px;
            font-size: 18px;
        }
        button {
            margin-top: 15px;
            padding: 14px 28px;
            background: #00ff9f;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 17px;
        }
        button:hover {
            background: #00cc7a;
        }
        #wallet-info {
            margin-top: 12px;
            font-size: 15px;
            color: #00cc7a;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>MONAD SNAKE 🐍</h1>
    <div style="position: relative;">
        <canvas id="game" width="600" height="600"></canvas>
        <div id="overlay">
            <h2>连接钱包才能开始游戏</h2>
            <p style="margin: 15px 0;">需连接 Monad 主网 EVM 钱包</p>
            <button onclick="connectWallet()">连接 Monad 主网钱包</button>
        </div>
    </div>
    
    <div class="info">
        <div>分数: <span id="score">0</span></div>
        <div>最高分: <span id="highscore">0</span></div>
    </div>

    <div id="wallet-info"></div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highscoreElement = document.getElementById('highscore');
        const walletInfo = document.getElementById('wallet-info');
        const overlay = document.getElementById('overlay');

        const MONAD_CHAIN_ID = 143; // Monad 主网

        const grid = 20;
        const rows = canvas.height / grid;
        const cols = canvas.width / grid;

        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let highScore = localStorage.getItem('monadSnakeHighScore') || 0;
        let isGameUnlocked = false;

        highscoreElement.textContent = highScore;

        function placeFood() {
            food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#00ff9f' : '#00cc7a';
                ctx.fillRect(segment.x * grid, segment.y * grid, grid - 2, grid - 2);
            });

            ctx.fillStyle = '#ff00aa';
            ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);
        }

        function update() {
            if (!isGameUnlocked) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || 
                snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }
            draw();
        }

        function gameOver() {
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('monadSnakeHighScore', highScore);
                highscoreElement.textContent = highScore;
            }
            alert(`🎮 游戏结束！\n你的分数：${score} 分\n最高纪录：${highScore} 分`);
            resetGame();
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            scoreElement.textContent = score;
            placeFood();
            draw();
        }

        // 键盘控制
        document.addEventListener('keydown', e => {
            if (!isGameUnlocked) return;
            switch(e.key) {
                case 'ArrowUp':    if (dy !== 1) { dx = 0; dy = -1; } break;
                case 'ArrowDown':  if (dy !== -1) { dx = 0; dy = 1; } break;
                case 'ArrowLeft':  if (dx !== 1) { dx = -1; dy = 0; } break;
                case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        // ==================== 连接钱包并解锁游戏 ====================
        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert('请先安装 MetaMask、Rabby 或其他 EVM 钱包');
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const userAddress = accounts[0];

                // 检查并切换网络
                const chainIdHex = await window.ethereum.request({ method: 'eth_chainId' });
                const currentChainId = parseInt(chainIdHex, 16);

                if (currentChainId !== MONAD_CHAIN_ID) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x8f' }]
                        });
                    } catch (switchError) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x8f',
                                chainName: 'Monad Mainnet',
                                nativeCurrency: { name: 'MON', symbol: 'MON', decimals: 18 },
                                rpcUrls: ['https://rpc.monad.xyz'],
                                blockExplorerUrls: ['https://monadvision.com']
                            }]
                        });
                    }
                }

                // 解锁游戏
                isGameUnlocked = true;
                overlay.style.display = 'none';
                
                walletInfo.innerHTML = `
                    ✅ 已连接 Monad 主网<br>
                    地址: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}
                `;

                // 开始游戏
                resetGame();
                draw();
                gameInterval = setInterval(update, 100);

            } catch (error) {
                console.error(error);
                alert('连接失败，请重试：' + error.message);
            }
        }

        // 初始化
        placeFood();
        draw();
    </script>
</body>
</html>
