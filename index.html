<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monad Snake 🐍</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff9f;
            flex-direction: column;
        }
        h1 { margin-bottom: 10px; text-shadow: 0 0 10px #00ff9f; }
        canvas {
            border: 4px solid #00ff9f;
            background: #111;
            image-rendering: pixelated;
        }
        button {
            margin-top: 15px;
            padding: 14px 28px;
            background: #00ff9f;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 17px;
        }
        #status { margin-top: 15px; font-size: 15px; color: #ffaa00; max-width: 600px; text-align: center; }
    </style>
</head>
<body>
    <h1>MONAD SNAKE 🐍</h1>
    <div style="position: relative;">
        <canvas id="game" width="600" height="600"></canvas>
        <div id="overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,10,10,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;">
            <h2>连接钱包才能开始游戏</h2>
            <p>需连接 Monad 主网 EVM 钱包</p>
            <button onclick="connectWallet()">连接 Monad 主网钱包</button>
        </div>
    </div>

    <div id="status"></div>

    <script>
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status');

        const MONAD_CHAIN_ID = 143;

        let isGameUnlocked = false;

        async function connectWallet() {
            status.innerHTML = "正在连接...";

            if (typeof window.ethereum === 'undefined') {
                status.innerHTML = `❌ 未检测到钱包<br>
                请安装 <b>MetaMask</b> 或 <b>Rabby</b> 浏览器插件后重试`;
                return;
            }

            try {
                status.innerHTML = "请求账户中...";
                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });
                
                const userAddress = accounts[0];
                status.innerHTML = `✅ 账户已连接: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}<br>正在检查网络...`;

                // 检查网络
                const chainIdHex = await window.ethereum.request({ method: 'eth_chainId' });
                const currentChainId = parseInt(chainIdHex, 16);

                if (currentChainId !== MONAD_CHAIN_ID) {
                    status.innerHTML = "正在切换到 Monad 主网...";
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x8f' }]
                        });
                    } catch (switchError) {
                        status.innerHTML = "正在添加 Monad 主网...";
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x8f',
                                chainName: 'Monad Mainnet',
                                nativeCurrency: { name: 'MON', symbol: 'MON', decimals: 18 },
                                rpcUrls: ['https://rpc.monad.xyz'],
                                blockExplorerUrls: ['https://monadvision.com']
                            }]
                        });
                    }
                }

                // 成功解锁
                isGameUnlocked = true;
                overlay.style.display = 'none';
                status.innerHTML = `✅ 已成功连接 Monad 主网！<br>地址: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}<br>现在可以开始玩游戏了`;

                resetGame();
                draw();
                gameInterval = setInterval(update, 100);

            } catch (error) {
                console.error(error);
                status.innerHTML = `❌ 连接失败<br><small>${error.message || error}</small><br><br>常见解决方法：<br>
                1. 刷新页面后重试<br>
                2. 确保钱包已解锁<br>
                3. 手动在钱包中切换到 Monad 主网`;
            }
        }

        // ==================== 游戏代码（保持不变） ====================
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;
        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 1, dy = 0;
        let score = 0;
        let gameInterval;

        function placeFood() {
            food = { x: Math.floor(Math.random() * (canvas.width/grid)), y: Math.floor(Math.random() * (canvas.height/grid)) };
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            snake.forEach((s,i) => {
                ctx.fillStyle = i===0 ? '#00ff9f' : '#00cc7a';
                ctx.fillRect(s.x*grid, s.y*grid, grid-2, grid-2);
            });
            ctx.fillStyle = '#ff00aa';
            ctx.fillRect(food.x*grid, food.y*grid, grid-2, grid-2);
        }

        function update() {
            if (!isGameUnlocked) return;
            // ...（游戏逻辑保持不变，这里省略以节省篇幅，实际使用时用之前完整版本）
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            if (head.x < 0 || head.x >= canvas.width/grid || head.y < 0 || head.y >= canvas.height/grid || snake.some(s => s.x === head.x && s.y === head.y)) {
                alert("游戏结束！分数: " + score);
                resetGame();
                return;
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                placeFood();
            } else {
                snake.pop();
            }
            draw();
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            placeFood();
            draw();
        }

        document.addEventListener('keydown', e => {
            if (!isGameUnlocked) return;
            switch(e.key) {
                case 'ArrowUp': if(dy !== 1){dx=0;dy=-1;} break;
                case 'ArrowDown': if(dy !== -1){dx=0;dy=1;} break;
                case 'ArrowLeft': if(dx !== 1){dx=-1;dy=0;} break;
                case 'ArrowRight': if(dx !== -1){dx=1;dy=0;} break;
            }
        });

        placeFood();
        draw();
    </script>
</body>
</html>
