<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monad Snake 🐍</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff9f;
            flex-direction: column;
        }
        h1 {
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff9f;
        }
        canvas {
            border: 4px solid #00ff9f;
            background: #111;
            image-rendering: pixelated;
        }
        .info {
            margin-top: 15px;
            display: flex;
            gap: 30px;
            font-size: 18px;
        }
        button {
            margin-top: 15px;
            padding: 12px 24px;
            background: #00ff9f;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #00cc7a;
        }
        #wallet-info {
            margin-top: 10px;
            font-size: 14px;
            color: #00cc7a;
        }
    </style>
</head>
<body>
    <h1>MONAD SNAKE 🐍</h1>
    <canvas id="game" width="600" height="600"></canvas>
    
    <div class="info">
        <div>分数: <span id="score">0</span></div>
        <div>最高分: <span id="highscore">0</span></div>
    </div>

    <button onclick="connectWallet()">连接 Monad 主网钱包</button>
    <div id="wallet-info"></div>
    
    <p style="margin-top:10px; font-size:14px; max-width:600px; text-align:center;">
        ↑ ↓ ← → 方向键控制 | 吃粉色方块成长<br>
        在 Monad 主网上玩 & 提交高分！
    </p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highscoreElement = document.getElementById('highscore');
        const walletInfo = document.getElementById('wallet-info');

        const MONAD_CHAIN_ID = 143; // Monad 主网 Chain ID
        const MONAD_RPC = "https://rpc.monad.xyz";

        const grid = 20;
        const rows = canvas.height / grid;
        const cols = canvas.width / grid;

        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let highScore = localStorage.getItem('monadSnakeHighScore') || 0;
        let userAddress = null;

        highscoreElement.textContent = highScore;

        function placeFood() {
            food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#00ff9f' : '#00cc7a';
                ctx.fillRect(segment.x * grid, segment.y * grid, grid - 2, grid - 2);
            });

            ctx.fillStyle = '#ff00aa';
            ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);
        }

        function update() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || 
                snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }
            draw();
        }

        function gameOver() {
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('monadSnakeHighScore', highScore);
                highscoreElement.textContent = highScore;
            }
            alert(`🎮 游戏结束！\n你的分数：${score} 分\n最高纪录：${highScore} 分`);
            resetGame();
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            scoreElement.textContent = score;
            placeFood();
            draw();
            gameInterval = setInterval(update, 100);
        }

        // 键盘控制
        document.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp':    if (dy !== 1) { dx = 0; dy = -1; } break;
                case 'ArrowDown':  if (dy !== -1) { dx = 0; dy = 1; } break;
                case 'ArrowLeft':  if (dx !== 1) { dx = -1; dy = 0; } break;
                case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        // ==================== Monad 钱包交互 ====================
        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert('请先安装 MetaMask 或 Rabby 钱包');
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];

                // 检查当前网络
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                const currentChainId = parseInt(chainId, 16);

                if (currentChainId !== MONAD_CHAIN_ID) {
                    if (confirm('当前不在 Monad 主网，是否切换到 Monad 主网？')) {
                        try {
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0x8f' }]  // 143 的 16 进制
                            });
                        } catch (switchError) {
                            // 如果网络不存在，添加 Monad 主网
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: '0x8f',
                                    chainName: 'Monad Mainnet',
                                    nativeCurrency: { name: 'MON', symbol: 'MON', decimals: 18 },
                                    rpcUrls: ['https://rpc.monad.xyz'],
                                    blockExplorerUrls: ['https://monadvision.com']
                                }]
                            });
                        }
                    }
                }

                // 显示钱包信息
                walletInfo.innerHTML = `
                    ✅ 已连接 Monad 主网<br>
                    地址: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}
                `;

                // 提交高分
                if (score > 0 || highScore > 0) {
                    const finalScore = Math.max(score, highScore);
                    alert(`🎉 高分已准备提交到 Monad 主网！\n\n分数：${finalScore} 分\n地址：${userAddress.slice(0,6)}...${userAddress.slice(-4)}\n\n（当前为演示版，后续可升级为真实链上排行榜）`);
                }

            } catch (error) {
                console.error(error);
                alert('连接失败：' + error.message);
            }
        }

        // 初始化游戏
        placeFood();
        draw();
        gameInterval = setInterval(update, 100);
    </script>
</body>
</html>
